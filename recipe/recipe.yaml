context:
  name: apache-airflow-providers-edge3
  version: "4.3.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/apache_airflow_providers_edge3-${{ version }}.tar.gz
  sha256: e59134dadc241c2f515d6a22bdf2f22c6f5a8e0114a0e714ff0051b0da69ebd4

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling ==1.31.0
    - packaging ==26.3
    - pathspec ==1.1.1
    - pluggy ==1.6.0
    # tightest of upstream's floors (python <3.11)
    # for all python to stay noarch: python
    - tomli ==2.4.1
    - trove-classifiers ==2026.6.1.19
  run:
    - python >=${{ python_min }}
    - apache-airflow >=3.0.0,!=3.1.0
    - apache-airflow-providers-common-compat >=1.15.0
    - pydantic >=2.11.0
    - retryhttp >=1.4.0
    - aiofiles >=23.2.0
    - aiohttp >=3.14.0

tests:
  - python:
      imports:
        - airflow.providers.edge3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/apache/airflow/
  summary: Provider package apache-airflow-providers-edge3 for Apache Airflow
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  documentation: https://airflow.apache.org/docs/apache-airflow-providers-edge3/stable/index.html
  repository: https://github.com/apache/airflow/

extra:
  recipe-maintainers:
    - xylar
