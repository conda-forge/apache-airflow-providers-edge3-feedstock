context:
  name: apache-airflow-providers-edge3
  version: "3.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/apache_airflow_providers_edge3-${{ version }}.tar.gz
  sha256: 900f8a7954fc1308f3ed57ae88d927831959201094022e22925f86a169a6fb58

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling ==1.29.0
    - packaging ==26.0
    - pathspec ==1.0.4
    - pluggy ==1.6.0
    # for all python to stay noarch: python
    - tomli ==2.4.0
    - trove-classifiers ==2026.1.14.14
  run:
    - python >=${{ python_min }}
    - apache-airflow >=3.0.0,!=3.1.0
    - apache-airflow-providers-common-compat >=1.14.0
    - pydantic >=2.11.0
    - retryhttp >=1.4.0
    - aiofiles >=23.2.0
    - aiohttp >=3.9.2

tests:
  - python:
      imports:
        - airflow.providers.edge3
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/apache/airflow/
  summary: Provider package apache-airflow-providers-edge3 for Apache Airflow
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  documentation: https://airflow.apache.org/docs/apache-airflow-providers-edge3/stable/index.html
  repository: https://github.com/apache/airflow/

extra:
  recipe-maintainers:
    - xylar
