context:
  name: apache-airflow-providers-edge3
  version: "5.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/apache_airflow_providers_edge3-${{ version }}.tar.gz
  sha256: 3e205e5015d8064b45ae99968f5427b33904f4ad315836c42edac174a28628a8

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling ==1.32.4
    - packaging ==26.3
    - pathspec ==1.1.1
    - pluggy ==1.6.0
    - tomlkit ==0.15.1
    - trove-classifiers ==2026.9.21.13
  run:
    - python >=${{ python_min }}
    - apache-airflow >=3.0.0,!=3.1.0
    - apache-airflow-providers-common-compat >=1.15.0
    - pydantic >=2.11.0
    - retryhttp >=1.4.0
    - aiofiles >=23.2.0
    - aiohttp >=3.14.0

tests:
  - python:
      imports:
        - airflow.providers.edge3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/apache/airflow/
  summary: Provider package apache-airflow-providers-edge3 for Apache Airflow
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  documentation: https://airflow.apache.org/docs/apache-airflow-providers-edge3/stable/index.html
  repository: https://github.com/apache/airflow/

extra:
  recipe-maintainers:
    - xylar
